name: source release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: source-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate immutable version identity
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Validate implementation and public history
        run: |
          python3 -m py_compile scripts/toolchain.py scripts/write_spdx_sbom.py ci/scan_public_repo.py
          python3 scripts/toolchain.py validate
          python3 -m unittest discover -s tests -v
          python3 ci/scan_public_repo.py

      - name: Build and verify release assets
        run: |
          bash scripts/package_source.sh dist
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Write download-first release notes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          archive = f"pleiades-factory-stack-{version}.tar.gz"
          notes = f"""# Pleiades Factory Stack {version}

## Download

**Download `{archive}` from the Assets section below.**

This release contains the Pleiades-owned source catalog and synchronization utility. It does **not** bundle any cataloged third-party source repositories.

Also download:

- `SHA256SUMS.txt` to verify every asset;
- `pleiades-factory-stack-{version}.spdx.json` for the SPDX 2.3 source inventory;
- `pleiades-factory-stack-{version}.build-receipt.json` for the exact commit and package hashes.

After extraction, run `python3 scripts/toolchain.py validate`. A catalog entry authorizes evaluation only; it does not authorize execution, installation, redistribution, or integration of the third-party project.
"""
          Path("dist/RELEASE-NOTES.md").write_text(notes, encoding="utf-8")
          PY

      - name: Refuse release overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists"
            exit 1
          fi

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.spdx.json \
            dist/*.build-receipt.json \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pleiades Factory Stack ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE-NOTES.md \
            --verify-tag
